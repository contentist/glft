[workspace]
resolver = "3"
members = ["crates/glft-core", "crates/glft-cli", "crates/glft-engine", "crates/glft-ffi", "crates/glft-gtk"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.96"

[workspace.dependencies]
glft-core = { path = "crates/glft-core" }
glft-engine = { path = "crates/glft-engine" }
# Exact: glft's route selector (crates/glft-core/src/route.rs) uses an API iroh marks
# unstable. Each iroh release: bump this, then rerun the route test (record 0006).
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
blake3 = "1"
bao-tree = { version = "0.16", default-features = false, features = ["tokio_fsm", "validate"] }
iroh-io = { version = "0.6", default-features = false, features = ["tokio-io"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "tracing-log"] }
directories = "6"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
serde_json = "1"
data-encoding = "2"
getrandom = "0.4"
xattr = { version = "1", default-features = false }
qrcode = { version = "0.14", default-features = false }
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }
libc = "0.2"
ksni = "0.3"

[profile.release]
codegen-units = 1
