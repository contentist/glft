[workspace]
resolver = "3"
members = ["crates/glft-core", "crates/glft-cli", "crates/glft-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.96"

[workspace.dependencies]
glft-core = { path = "crates/glft-core" }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
blake3 = "1"
bao-tree = { version = "0.16", default-features = false, features = ["tokio_fsm", "validate"] }
iroh-io = { version = "0.6", default-features = false, features = ["tokio-io"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
directories = "6"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"

[profile.release]
codegen-units = 1
